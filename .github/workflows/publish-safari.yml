name: Publish Safari

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  BUNDLE_ID: io.github.joshwright22.algone.safari
  APP_NAME: Algone for Safari
  SAFARI_SCHEME: Algone for Safari (iOS)

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check secrets
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          ready=true
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then ready=false; fi
          done
          if [ "$ready" = false ]; then
            echo "::notice::Safari secrets are not set, so nothing was published. See docs/setup.md."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Download and verify the build
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern algone-safari-source.zip --pattern SHA256SUMS
          grep ' algone-safari-source.zip$' SHA256SUMS | shasum -a 256 -c -
          unzip -q algone-safari-source.zip -d safari-extension
      - name: Install the signing certificate and profiles
        if: steps.check.outputs.ready == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_EXTENSION_PROFILE_BASE64: ${{ secrets.BUILD_EXTENSION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profiles/app.mobileprovision"
          # The extension target has its own bundle ID, so it normally needs its own profile.
          if [ -n "$BUILD_EXTENSION_PROFILE_BASE64" ]; then
            printf '%s' "$BUILD_EXTENSION_PROFILE_BASE64" | base64 --decode > "$profiles/extension.mobileprovision"
          fi
      - name: Package the extension as an Xcode project
        if: steps.check.outputs.ready == 'true'
        run: |
          xcrun safari-web-extension-packager safari-extension \
            --project-location build --app-name "$APP_NAME" --bundle-identifier "$BUNDLE_ID" \
            --swift --copy-resources --no-open --no-prompt --force
          mkdir -p "build/$APP_NAME/fastlane"
          cp scripts/ci/safari/Fastfile "build/$APP_NAME/fastlane/Fastfile"
      - name: Build and upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd "build/$APP_NAME"
          gem install fastlane -v 2.241.2 --no-document --user-install
          "$(ruby -e 'puts Gem.user_dir')/bin/fastlane" ios release
      - name: Remove the keychain
        if: always() && steps.check.outputs.ready == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
