name: Release

on:
  schedule:
    # Avoids minute zero, when GitHub's scheduled jobs are busiest.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: Stable version (X.Y.Z). Defaults to the next patch after the latest stable tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: false

jobs:
  # Picks the commit and names. Stable builds the commit of the latest nightly,
  # so it only ships what nightly users ran.
  resolve:
    if: github.repository == 'JoshWright22/Algone'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      manifest_version: ${{ steps.meta.outputs.manifest_version }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      promoted_from: ${{ steps.meta.outputs.promoted_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/ci/release-meta.mjs

  build:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build all browsers
        env:
          MANIFEST_VERSION: ${{ needs.resolve.outputs.manifest_version }}
        run: node apps/extension/scripts/build.mjs --target all --version "$MANIFEST_VERSION"
      - name: Unit and static tests
        run: npx vitest run
      - name: Build the website, for rules.json
        run: npm run website
      - name: Zip the assets
        run: |
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          for browser in chrome edge firefox; do
            (cd "apps/extension/dist/$browser" && zip -qr "$out/algone-$browser.zip" .)
          done
          (cd apps/extension/dist/safari && zip -qr "$out/algone-safari-source.zip" .)
          git archive --format=zip -o "$out/algone-source.zip" HEAD
          cp apps/website/dist/rules/v1/rules.json "$out/rules.json"
          ls -l "$out"
      - name: State what Firefox source review needs
        run: node scripts/ci/release-notes.mjs --firefox-review | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  # The release still ships if this job fails. publish reports the missing APK.
  apk:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Generate the Android project
        run: |
          npm ci
          cd apps/mobile
          npm ci
          npx expo prebuild --platform android --no-install
      # Expo's template signs release builds with the debug key.
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/algone-browser-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/apk
          if-no-files-found: error

  # Stable waits here for the owner's approval, then creates the tag with GITHUB_TOKEN.
  # A nightly uses no environment, and gh release create makes its tag in the publish job.
  # This job runs no project code, so the keystore never meets npm or Gradle.
  sign-and-tag:
    needs: [resolve, build, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve.outputs.channel == 'stable' && 'release' || '' }}
    permissions:
      contents: write
    outputs:
      apk_state: ${{ steps.apk.outputs.state }}
    steps:
      - name: Download the APK
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-unsigned
          path: apk
      - name: Sign the APK if a keystore is present
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          file=apk/algone-browser-android.apk
          if [ ! -f "$file" ]; then
            echo "::notice::The APK job produced no file, so this release has no APK."
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::notice::No Android keystore here, so the APK stays debug-signed and is labeled a testing build."
            echo "state=testing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          key_pass=KEYSTORE_PASSWORD
          if [ -n "$KEY_PASSWORD" ]; then
            key_pass=KEY_PASSWORD
          fi
          # v4 signing would write an .idsig file beside the APK, and it would ship as an asset.
          if "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass "env:$key_pass" \
            --ks-key-alias "$KEY_ALIAS" --v4-signing-enabled false "$file"; then
            echo "state=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing failed, so the APK stays debug-signed and is labeled a testing build."
            echo "state=testing" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/release.keystore"
      - if: steps.apk.outputs.state != 'missing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-final
          path: apk
      - name: Create the stable tag
        if: needs.resolve.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"

  publish:
    needs: [resolve, sign-and-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - if: needs.sign-and-tag.outputs.apk_state != 'missing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-final
          path: assets
      - name: Write checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Write the notes
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MANIFEST_VERSION: ${{ needs.resolve.outputs.manifest_version }}
          PROMOTED_FROM: ${{ needs.resolve.outputs.promoted_from }}
          APK_STATE: ${{ needs.sign-and-tag.outputs.apk_state }}
        run: node scripts/ci/release-notes.mjs > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TITLE: ${{ needs.resolve.outputs.title }}
          SHA: ${{ needs.resolve.outputs.sha }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md --generate-notes)
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          if [ "$CHANNEL" = stable ]; then
            args+=(--verify-tag --latest)
          else
            args+=(--target "$SHA" --prerelease --latest=false)
          fi
          gh release create "$TAG" assets/* "${args[@]}"

  # A tag made with GITHUB_TOKEN starts no workflows, so these start by dispatch.
  stores:
    needs: [resolve, publish]
    if: needs.resolve.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the store workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          for store in chrome firefox edge safari mobile; do
            gh workflow run "publish-$store.yml" --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          done
