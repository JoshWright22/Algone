name: Publish Chrome

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check secrets
        id: check
        env:
          CWS_SA_KEY_JSON: ${{ secrets.CWS_SA_KEY_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_SA_KEY_JSON" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "::notice::Chrome secrets are not set, so nothing was published. See docs/setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Download and verify the zip
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern algone-chrome.zip --pattern SHA256SUMS
          grep ' algone-chrome.zip$' SHA256SUMS | sha256sum -c -
      - name: Upload and submit for review
        if: steps.check.outputs.ready == 'true'
        env:
          CWS_SA_KEY_JSON: ${{ secrets.CWS_SA_KEY_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/ci/publish-chrome.mjs algone-chrome.zip
