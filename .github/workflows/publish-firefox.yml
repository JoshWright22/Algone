name: Publish Firefox

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check secrets
        id: check
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::Firefox secrets are not set, so nothing was published. See docs/setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Download and verify the build and source
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern algone-firefox.zip --pattern algone-source.zip --pattern SHA256SUMS
          cd release
          grep -E ' algone-(firefox|source).zip$' SHA256SUMS | sha256sum -c -
          unzip -q algone-firefox.zip -d firefox
      - name: Submit a listed version with source
        if: steps.check.outputs.ready == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          metadata=()
          if [ -f store/firefox/amo-metadata.json ]; then
            metadata=(--amo-metadata store/firefox/amo-metadata.json)
          fi
          npx --yes web-ext@10.8.0 sign --channel=listed --approval-timeout=0 \
            --source-dir release/firefox --artifacts-dir release/signed \
            --upload-source-code release/algone-source.zip "${metadata[@]}"
