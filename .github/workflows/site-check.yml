name: Site check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      simulate_break:
        description: Site ID to check with a deliberately wrong selector (for example youtube)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  # Loads hostile-by-default pages, so it holds no write access.
  check:
    if: github.repository == 'JoshWright22/Algone'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node apps/extension/scripts/build.mjs --target chrome --test --out-dir apps/extension/dist-test
      - name: Check the live sites
        env:
          SIMULATE_BREAK: ${{ inputs.simulate_break }}
        run: |
          args=()
          if [ -n "$SIMULATE_BREAK" ]; then
            if ! printf '%s' "$SIMULATE_BREAK" | grep -Eq '^[a-z0-9-]+$'; then
              echo "::error::simulate_break must be a site ID."
              exit 1
            fi
            args=(--site "$SIMULATE_BREAK" --simulate-break "$SIMULATE_BREAK")
          fi
          node tests/live/run.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-snapshots
          path: test-results/live
          retention-days: 30
          if-no-files-found: error

  # Runs only node built-ins from the repo: no npm install and no browser next to the write token.
  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-snapshots
          path: test-results/live
      - name: Write status and open issues
        env:
          MAINTAINERS: ${{ vars.MAINTAINERS }}
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SIMULATE_BREAK: ${{ inputs.simulate_break }}
        run: node scripts/ci/site-status.mjs
