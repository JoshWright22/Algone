name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node apps/extension/scripts/build.mjs --target all
      - run: node apps/extension/scripts/build.mjs --target chrome,firefox --test --out-dir apps/extension/dist-test
      - name: Unit and static tests
        run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test --project=e2e
      # ubuntu-latest ships Firefox and geckodriver.
      - name: Firefox smoke test
        run: |
          firefox --version
          node tests/firefox/smoke.mjs
      - name: Lint the Firefox build
        run: npx web-ext lint --source-dir apps/extension/dist/firefox

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run website

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # The mobile tests run the vitest installed at the repo root.
      - name: Install root dependencies
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export --platform ios --platform android
